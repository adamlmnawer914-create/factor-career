  <!-- Failsafe Recovery Script against White Screen -->
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var main = document.getElementById('main-content');
        if (main && (!main.children.length || main.innerHTML.indexOf('<!-- Dynamic Page Content') !== -1)) {
          console.warn('Failsafe triggered: Rendering home page directly');
          if (window.CareerAI && window.CareerAI.pages && window.CareerAI.pages.home) {
            main.innerHTML = window.CareerAI.pages.home();
          }
          var header = document.getElementById('header');
          var footer = document.querySelector('footer.footer') || document.getElementById('mainFooter');
          var app = document.getElementById('app');
          if (!header && app && window.CareerAI && window.CareerAI.components) {
            try { app.insertAdjacentHTML('afterbegin', window.CareerAI.components.renderHeader()); } catch(e){}
          }
          if (!footer && app && window.CareerAI && window.CareerAI.components) {
            try { app.insertAdjacentHTML('beforeend', window.CareerAI.components.renderFooter()); } catch(e){}
          }
        }
      }, 1200);
    });
  </script>
